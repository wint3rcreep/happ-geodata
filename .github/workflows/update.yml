name: Build and publish geodata
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: geodata-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile and unit tests
        run: |
          python3 -m py_compile build.py test_build.py
          python3 -m unittest -v test_build
      - name: Download, combine and validate
        run: python3 build.py --root "$RUNNER_TEMP/geodata"
      - name: Publish complete generation atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          target="$RUNNER_TEMP/publish"
          if git ls-remote --exit-code "$url" refs/heads/release; then
            git clone --depth 1 --branch release --single-branch "$url" "$target"
          else
            git init -b release "$target"
            git -C "$target" remote add origin "$url"
          fi
          cp "$RUNNER_TEMP/geodata/current/geosite.dat" "$target/geosite.dat"
          cp "$RUNNER_TEMP/geodata/current/geoip.dat" "$target/geoip.dat"
          cp "$RUNNER_TEMP/geodata/current/manifest.json" "$target/manifest.json"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add geosite.dat geoip.dat manifest.json
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m 'data: publish validated geodata generation'
            git -C "$target" push origin HEAD:release
          fi
